[package]
name = "frostbite-formats"
description = "Read and write the Frostbite containers and resources of skate. (2025): TOCs, bundles, CAS, EBX documents, shaders, meshes, physics, .fbmod mods"
keywords = ["frostbite", "skate", "ebx", "modding", "game-files"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/frostbite-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
half.workspace = true
sha1.workspace = true
thiserror.workspace = true

[dev-dependencies]
primase-foundations = { workspace = true, features = ["compress", "reference-decoder"] }
primase-testdata.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/frostbite-formats"
publish = true

[workspace.dependencies]
half = { version = "=2.7.1", default-features = false }
primase-foundations = { version = "0.3.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e" }
primase-testdata = { version = "0.1.2", git = "https://github.com/Kalmarv/primase-testdata", rev = "4fce41eecd06019bc44310de919313119cda4c34" }
sha1 = { version = "=0.11.0", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
